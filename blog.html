<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blog — 云离</title>
  <meta name="description" content="云离的个人博客与学习记录">
  <link rel="stylesheet" href="source/ui-polish.css">
  <script src="source/typewriter.js" defer></script>
</head>
<body class="preload page-blog">
  <header>
    <a href="index.html" class="brand">云离</a>
    <nav class="nav-links" aria-label="主导航">
      <a href="blog.html" aria-current="page">Blog</a>
      <a href="projects.html">Projects</a>
      <a href="about.html">About</a>
      <button id="themeSwitch" class="menu-btn" type="button" aria-label="切换到浅色主题" title="切换日/夜模式">🌙</button>
    </nav>
  </header>

  <main class="wrap blog-wrap">
    <section class="blog-intro" aria-labelledby="blog-title">
      <div>
        <p class="eyebrow">YL / FIELD NOTES / 2026</p>
        <h1 id="blog-title">Blog</h1>
      </div>
      <p class="blog-type-note typewriter-line" data-typewriter data-typewriter-speed="120" data-typewriter-start="460">写点傻开心的东西</p>
    </section>

    <form class="query-panel" role="search" aria-label="检索博客文章">
      <div class="query-row">
        <label class="query-label" for="searchInput">SEARCH</label>
        <div class="search-control">
          <span class="search-mark" aria-hidden="true">⌕</span>
          <input id="searchInput" class="search-input" type="search" autocomplete="off" placeholder="输入标题、标签或关键词">
          <button id="clearSearch" class="clear-search" type="button" hidden>清除</button>
        </div>
      </div>

      <div class="query-row">
        <span class="query-label" id="categoryLabel">CHANNEL</span>
        <div class="filter-list" role="group" aria-labelledby="categoryLabel">
          <button class="filter-button is-active" type="button" data-category="all" aria-pressed="true">all</button>
          <button class="filter-button" type="button" data-category="course" aria-pressed="false">course</button>
          <button class="filter-button" type="button" data-category="academic" aria-pressed="false">academic</button>
          <button class="filter-button" type="button" data-category="reflection" aria-pressed="false">reflection</button>
          <button class="filter-button" type="button" data-category="daily-life" aria-pressed="false">daily-life</button>
        </div>
        <select id="categorySelect" class="visually-hidden" tabindex="-1" aria-hidden="true">
          <option value="all">all</option>
          <option value="course">course</option>
          <option value="academic">academic</option>
          <option value="reflection">reflection</option>
          <option value="daily-life">daily-life</option>
        </select>
      </div>
    </form>

    <div id="resultMeta" class="result-line" aria-live="polite">SYNC / INDEX</div>
    <div id="list" aria-busy="true">
      <p class="list-status">正在读取文章索引</p>
    </div>
  </main>

  <footer>© 云离 / Notes archive</footer>

  <script>
    const LIKE_API = 'https://homepagelike.12410922.workers.dev/like';
    const CATEGORY_LABELS = {
      all: 'all',
      course: 'course',
      academic: 'academic',
      reflection: 'reflection',
      'daily-life': 'daily-life',
      uncategorized: 'uncategorized'
    };

    const state = {
      items: [],
      activeCategory: 'all',
      query: '',
      likes: new Map(),
      likesReady: false
    };

    async function tryFetch(url){
      const response = await fetch(url);
      if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    function normalizeTags(tags){
      if(!tags) return [];
      if(Array.isArray(tags)) return tags.map(tag => String(tag).toLowerCase());
      return String(tags).split(/[,\s]+/).map(tag => tag.toLowerCase()).filter(Boolean);
    }

    function displayTags(tags){
      if(!tags) return [];
      if(Array.isArray(tags)) return tags.map(tag => String(tag).trim()).filter(Boolean);
      return String(tags).split(',').map(tag => tag.trim()).filter(Boolean);
    }

    function getCategory(item){
      if(item.category) return String(item.category).toLowerCase();
      const known = ['course','academic','reflection','daily-life'];
      return normalizeTags(item.tags).find(tag => known.includes(tag)) || 'uncategorized';
    }

    function matchesQuery(item, query){
      const words = String(query || '').toLowerCase().trim().split(/[\s,]+/).filter(Boolean);
      if(words.length === 0) return true;
      const haystack = `${item.title || ''} ${normalizeTags(item.tags).join(' ')}`.toLowerCase();
      return words.every(word => haystack.includes(word));
    }

    function normalizeFilePath(file){
      const value = String(file || '');
      return value.startsWith('/') ? value.slice(1) : value;
    }

    async function getLikeCount(file){
      try{
        const response = await fetch(`${LIKE_API}?id=${encodeURIComponent(file)}`);
        if(!response.ok) return 0;
        const data = await response.json();
        return Number(data.likes) || 0;
      }catch(error){
        return 0;
      }
    }

    function appendMeta(container, text){
      const item = document.createElement('span');
      item.textContent = text;
      container.appendChild(item);
    }

    function createPostElement(item, index){
      const filePath = normalizeFilePath(item.file);
      const category = getCategory(item);
      const likes = state.likes.get(filePath);
      const article = document.createElement('article');
      article.className = 'post pop-in has-cover';
      article.style.animationDelay = `${Math.min(index * 45, 270)}ms`;

      const number = document.createElement('span');
      number.className = 'post-index';
      number.textContent = String(index + 1).padStart(2, '0');
      article.appendChild(number);

      const content = document.createElement('div');
      content.className = 'post-content';

      const heading = document.createElement('h2');
      const link = document.createElement('a');
      link.href = `post.html?file=${encodeURIComponent(filePath)}`;
      link.textContent = item.title || '未命名文章';
      heading.appendChild(link);
      content.appendChild(heading);

      const meta = document.createElement('div');
      meta.className = 'post-meta';
      appendMeta(meta, item.date || 'DATE —');
      appendMeta(meta, `CHANNEL / ${CATEGORY_LABELS[category] || category}`);
      appendMeta(meta, `SIGNAL / ${typeof likes === 'number' ? likes : '—'}`);
      content.appendChild(meta);

      if(item.excerpt){
        const excerpt = document.createElement('p');
        excerpt.className = 'post-excerpt';
        excerpt.textContent = item.excerpt;
        content.appendChild(excerpt);
      }

      const tags = displayTags(item.tags);
      if(tags.length){
        const tagList = document.createElement('div');
        tagList.className = 'post-tags';
        tagList.setAttribute('aria-label', '文章标签');
        tags.forEach(tag => {
          const tagItem = document.createElement('span');
          tagItem.className = 'post-tag';
          tagItem.textContent = tag;
          tagList.appendChild(tagItem);
        });
        content.appendChild(tagList);
      }
      article.appendChild(content);

      const cover = document.createElement('div');
      cover.className = 'post-cover';
      const image = document.createElement('img');
      const baseName = filePath.split('/').pop() || 'post.md';
      const coverFile = baseName.replace(/\.md$/i, '_cover.png');
      image.src = `source/${encodeURIComponent(coverFile)}`;
      image.alt = '';
      image.loading = index > 1 ? 'lazy' : 'eager';
      image.decoding = 'async';
      image.addEventListener('error', () => {
        cover.hidden = true;
        article.classList.remove('has-cover');
      });
      cover.appendChild(image);
      article.appendChild(cover);

      return article;
    }

    function getFilteredItems(){
      const filtered = state.items.filter(item => {
        const categoryMatches = state.activeCategory === 'all'
          || getCategory(item) === state.activeCategory
          || normalizeTags(item.tags).includes(state.activeCategory);
        return categoryMatches && matchesQuery(item, state.query);
      });

      if(state.likesReady){
        filtered.sort((a,b) => {
          const difference = (state.likes.get(normalizeFilePath(b.file)) || 0)
            - (state.likes.get(normalizeFilePath(a.file)) || 0);
          return difference || String(b.date || '').localeCompare(String(a.date || ''));
        });
      }
      return filtered;
    }

    function renderList(){
      const list = document.getElementById('list');
      const resultMeta = document.getElementById('resultMeta');
      const items = getFilteredItems();
      list.replaceChildren();
      list.setAttribute('aria-busy', 'false');

      const mode = state.likesReady ? 'POPULARITY' : 'SYNCING SIGNAL';
      resultMeta.textContent = `${String(items.length).padStart(2, '0')} ENTRIES / ${mode}`;

      if(items.length === 0){
        const empty = document.createElement('p');
        empty.className = 'list-status';
        empty.textContent = state.query ? '没有匹配当前关键词的文章' : '当前分类暂时没有文章';
        list.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      items.forEach((item,index) => fragment.appendChild(createPostElement(item,index)));
      list.appendChild(fragment);
    }

    async function loadLikes(){
      await Promise.all(state.items.map(async item => {
        const filePath = normalizeFilePath(item.file);
        state.likes.set(filePath, await getLikeCount(filePath));
      }));
      state.likesReady = true;
      renderList();
    }

    async function loadIndex(){
      const list = document.getElementById('list');
      const candidates = ['posts/index.json','/posts/index.json',`${location.origin}/posts/index.json`];
      let index = null;

      for(const url of candidates){
        try{
          index = await tryFetch(url);
          break;
        }catch(error){
          console.warn('Index candidate failed:', url, error);
        }
      }

      if(!Array.isArray(index)){
        list.setAttribute('aria-busy', 'false');
        list.innerHTML = '<p class="list-status">文章索引读取失败，请稍后重试</p>';
        document.getElementById('resultMeta').textContent = 'SYNC / FAILED';
        return;
      }

      state.items = index;
      renderList();
      loadLikes();
    }

    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const categorySelect = document.getElementById('categorySelect');
    const filterButtons = Array.from(document.querySelectorAll('.filter-button'));

    searchInput.addEventListener('input', () => {
      state.query = searchInput.value;
      clearSearch.hidden = state.query.length === 0;
      renderList();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      state.query = '';
      clearSearch.hidden = true;
      searchInput.focus();
      renderList();
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        state.activeCategory = button.dataset.category || 'all';
        categorySelect.value = state.activeCategory;
        filterButtons.forEach(item => {
          const active = item === button;
          item.classList.toggle('is-active', active);
          item.setAttribute('aria-pressed', String(active));
        });
        renderList();
      });
    });

    document.querySelector('.query-panel').addEventListener('submit', event => event.preventDefault());
    loadIndex();
  </script>

  <script>
    const themeSwitch = document.getElementById('themeSwitch');

    function applyTheme(theme){
      const light = theme === 'light';
      document.body.classList.toggle('light', light);
      themeSwitch.textContent = light ? '☀️' : '🌙';
      themeSwitch.setAttribute('aria-label', light ? '切换到深色主题' : '切换到浅色主题');
      try{localStorage.setItem('site-theme', theme)}catch(error){}
    }

    (function(){
      let theme = 'dark';
      try{theme = localStorage.getItem('site-theme') || 'dark'}catch(error){}
      applyTheme(theme);
      themeSwitch.addEventListener('click', () => {
        applyTheme(document.body.classList.contains('light') ? 'dark' : 'light');
      });
    })();

    window.addEventListener('load', () => {
      document.body.classList.add('reveal');
      document.body.classList.remove('preload');
    });
  </script>
</body>
</html>
