<body class="preload page-blog">
  <header>
    <a href="./" class="brand" data-i18n="brand.name">Yunli</a>
    <div class="header-actions">
      <nav class="nav-links" aria-label="Main navigation" data-i18n-aria-label="nav.label">
        <a href="blog.html" aria-current="page" data-i18n="nav.blog">Blog</a>
        <a href="projects.html" data-i18n="nav.projects">Projects</a>
        <a href="about.html" data-i18n="nav.about">About</a>
      </nav>
      <div class="utility-switches">
        <button id="languageSwitch" class="cute-switch language-switch" type="button" data-language-toggle data-state="en" role="switch" aria-checked="false" aria-label="Chinese interface" data-i18n-aria-label="controls.language.label" title="Switch to Chinese" data-i18n-title="controls.language.action">
          <span class="switch-track" aria-hidden="true">
            <span class="switch-option switch-option-left">EN</span>
            <span class="switch-option switch-option-right">中</span>
            <span class="switch-thumb"></span>
          </span>
        </button>
        <button id="themeSwitch" class="cute-switch theme-switch" type="button" data-theme-toggle data-state="dark" role="switch" aria-checked="true" aria-label="Dark mode" data-i18n-aria-label="controls.theme.label" title="Switch to light theme" data-i18n-title="controls.theme.toLight">
          <span class="switch-track" aria-hidden="true">
            <span class="switch-option switch-option-left">☀️</span>
            <span class="switch-option switch-option-right">🌙</span>
            <span class="switch-thumb"></span>
          </span>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap blog-wrap">
    <section class="blog-intro" aria-labelledby="blog-title">
      <div>
        <p class="eyebrow" data-i18n="blog.eyebrow">YL / FIELD NOTES / 2026</p>
        <h1 id="blog-title" data-i18n="blog.title">Blog</h1>
      </div>
      <p class="blog-type-note typewriter-line" data-typewriter data-typewriter-speed="120" data-typewriter-start="460" data-i18n="blog.note">A small collection of things that make me smile.</p>
    </section>

    <form class="query-panel" role="search" aria-label="Search blog posts" data-i18n-aria-label="blog.search.label">
      <div class="query-row">
        <label class="query-label" for="searchInput" data-i18n="blog.search.heading">SEARCH</label>
        <div class="search-control">
          <span class="search-mark" aria-hidden="true">⌕</span>
          <input id="searchInput" class="search-input" type="search" autocomplete="off" placeholder="Search titles, tags, or keywords" data-i18n-placeholder="blog.search.placeholder">
          <button id="clearSearch" class="clear-search" type="button" hidden data-i18n="blog.search.clear">Clear</button>
        </div>
      </div>

      <div class="query-row">
        <span class="query-label" id="categoryLabel" data-i18n="blog.category.heading">CATEGORY</span>
        <div class="filter-list" role="group" aria-labelledby="categoryLabel">
          <button class="filter-button is-active" type="button" data-category="all" aria-pressed="true" data-i18n="blog.category.all">All</button>
          <button class="filter-button" type="button" data-category="course" aria-pressed="false" data-i18n="blog.category.course">Courses</button>
          <button class="filter-button" type="button" data-category="academic" aria-pressed="false" data-i18n="blog.category.academic">Academic</button>
          <button class="filter-button" type="button" data-category="reflection" aria-pressed="false" data-i18n="blog.category.reflection">Reflections</button>
          <button class="filter-button" type="button" data-category="daily-life" aria-pressed="false" data-i18n="blog.category.daily-life">Daily Life</button>
        </div>
        <select id="categorySelect" class="visually-hidden" tabindex="-1" aria-hidden="true">
          <option value="all" data-i18n="blog.category.all">All</option>
          <option value="course" data-i18n="blog.category.course">Courses</option>
          <option value="academic" data-i18n="blog.category.academic">Academic</option>
          <option value="reflection" data-i18n="blog.category.reflection">Reflections</option>
          <option value="daily-life" data-i18n="blog.category.daily-life">Daily Life</option>
        </select>
      </div>
    </form>

    <div id="resultMeta" class="result-line" aria-live="polite" data-i18n="blog.status.sync">SYNC / INDEX</div>
    <div id="list" aria-busy="true">
      <p class="list-status" data-i18n="blog.status.loading">Loading post index…</p>
    </div>
    <noscript>
      <style>#resultMeta,#list{display:none}</style>
      <p class="list-status">JavaScript is required to load and filter the blog archive.</p>
    </noscript>
  </main>

  <footer><span data-i18n="blog.footer">© Yunli · Notes Archive</span></footer>

  <script>
    const LIKE_API = 'https://homepagelike.12410922.workers.dev/like';
    const state = {
      items: [],
      activeCategory: 'all',
      query: '',
      likes: new Map(),
      availableCovers: new Set(),
      likesReady: false,
      likesStatus: 'loading',
      loadState: 'loading'
    };

    const t = (key, replacements = {}) => {
      if(window.SiteUI?.t) return window.SiteUI.t(key, replacements);
      const language = document.documentElement.dataset.language === 'zh' ? 'zh' : 'en';
      let value = window.PAGE_I18N?.[language]?.[key] ?? window.PAGE_I18N?.en?.[key] ?? key;
      Object.entries(replacements).forEach(([name,replacement]) => {
        value = value.replaceAll(`{${name}}`, String(replacement));
      });
      return value;
    };

    function categoryLabel(category){
      const known = ['all','course','academic','reflection','daily-life','uncategorized'];
      return t(`blog.category.${known.includes(category) ? category : 'uncategorized'}`);
    }

    async function tryFetch(url){
      const response = await fetch(url);
      if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    async function fetchWithTimeout(url, options = {}, timeout = 8000){
      const controller = new AbortController();
      const timer = window.setTimeout(() => controller.abort(), timeout);
      try{
        return await fetch(url, {...options, signal:controller.signal});
      }finally{
        window.clearTimeout(timer);
      }
    }

    function normalizeTags(tags){
      if(!tags) return [];
      if(Array.isArray(tags)) return tags.map(tag => String(tag).toLowerCase());
      return String(tags).split(/[,\s]+/).map(tag => tag.toLowerCase()).filter(Boolean);
    }

    function displayTags(tags){
      if(!tags) return [];
      if(Array.isArray(tags)) return tags.map(tag => String(tag).trim()).filter(Boolean);
      return String(tags).split(',').map(tag => tag.trim()).filter(Boolean);
    }

    function getCategory(item){
      if(item.category) return String(item.category).toLowerCase();
      const known = ['course','academic','reflection','daily-life'];
      return normalizeTags(item.tags).find(tag => known.includes(tag)) || 'uncategorized';
    }

    function matchesQuery(item, query){
      const words = String(query || '').toLowerCase().trim().split(/[\s,]+/).filter(Boolean);
      if(words.length === 0) return true;
      const haystack = `${item.title || ''} ${item.excerpt || ''} ${normalizeTags(item.tags).join(' ')}`.toLowerCase();
      return words.every(word => haystack.includes(word));
    }

    function normalizeFilePath(file){
      const value = String(file || '');
      return value.startsWith('/') ? value.slice(1) : value;
    }

    function coverFileFor(item){
      const baseName = normalizeFilePath(item.file).split('/').pop() || 'post.md';
      return baseName.replace(/\.md$/i, '_cover.png');
    }

    async function loadCoverManifest(){
      try{
        const manifest = await tryFetch('source/blog-covers.json');
        const covers = Array.isArray(manifest) ? manifest : manifest.covers;
        state.availableCovers = new Set(Array.isArray(covers) ? covers.map(String) : []);
      }catch(error){
        state.availableCovers = new Set();
      }
    }

    async function getLikeCount(file){
      try{
        const response = await fetchWithTimeout(`${LIKE_API}?id=${encodeURIComponent(file)}`);
        if(!response.ok) return null;
        const data = await response.json();
        const likes = Number(data.likes);
        return Number.isFinite(likes) ? likes : null;
      }catch(error){
        return null;
      }
    }

    function appendMeta(container, text){
      const item = document.createElement('span');
      item.textContent = text;
      container.appendChild(item);
    }

    function createPostElement(item, index){
      const filePath = normalizeFilePath(item.file);
      const category = getCategory(item);
      const likes = state.likes.get(filePath);
      const coverFile = coverFileFor(item);
      const coverAvailable = state.availableCovers.has(coverFile);
      const article = document.createElement('article');
      article.className = `post pop-in${coverAvailable ? ' has-cover' : ''}`;
      article.style.animationDelay = `${Math.min(index * 45, 270)}ms`;

      const number = document.createElement('span');
      number.className = 'post-index';
      number.textContent = String(index + 1).padStart(2, '0');
      article.appendChild(number);

      const content = document.createElement('div');
      content.className = 'post-content';

      const heading = document.createElement('h2');
      const link = document.createElement('a');
      link.href = `post.html?file=${encodeURIComponent(filePath)}`;
      link.textContent = item.title || t('blog.untitled');
      heading.appendChild(link);
      content.appendChild(heading);

      const meta = document.createElement('div');
      meta.className = 'post-meta';
      appendMeta(meta, item.date || t('blog.dateFallback'));
      appendMeta(meta, t('blog.meta.category', {category: categoryLabel(category)}));
      appendMeta(meta, t('blog.meta.likes', {likes: typeof likes === 'number' ? likes : '—'}));
      content.appendChild(meta);

      if(item.excerpt){
        const excerpt = document.createElement('p');
        excerpt.className = 'post-excerpt';
        excerpt.textContent = item.excerpt;
        content.appendChild(excerpt);
      }

      const tags = displayTags(item.tags);
      if(tags.length){
        const tagList = document.createElement('div');
        tagList.className = 'post-tags';
        tagList.setAttribute('aria-label', t('blog.tags.label'));
        tags.forEach(tag => {
          const tagItem = document.createElement('span');
          tagItem.className = 'post-tag';
          tagItem.textContent = tag;
          tagList.appendChild(tagItem);
        });
        content.appendChild(tagList);
      }
      article.appendChild(content);

      if(coverAvailable){
        const cover = document.createElement('div');
        cover.className = 'post-cover';
        const image = document.createElement('img');
        image.src = `source/${encodeURIComponent(coverFile)}`;
        image.alt = '';
        image.loading = index > 1 ? 'lazy' : 'eager';
        image.decoding = 'async';
        image.addEventListener('error', () => {
          cover.hidden = true;
          article.classList.remove('has-cover');
        });
        cover.appendChild(image);
        article.appendChild(cover);
      }

      return article;
    }

    function getFilteredItems(){
      const filtered = state.items.filter(item => {
        const categoryMatches = state.activeCategory === 'all'
          || getCategory(item) === state.activeCategory
          || normalizeTags(item.tags).includes(state.activeCategory);
        return categoryMatches && matchesQuery(item, state.query);
      });

      if(state.likesReady){
        filtered.sort((a,b) => {
          const difference = (state.likes.get(normalizeFilePath(b.file)) || 0)
            - (state.likes.get(normalizeFilePath(a.file)) || 0);
          return difference || String(b.date || '').localeCompare(String(a.date || ''));
        });
      }
      return filtered;
    }

    function renderList(){
      const list = document.getElementById('list');
      const resultMeta = document.getElementById('resultMeta');
      if(state.loadState === 'loading'){
        list.replaceChildren();
        list.setAttribute('aria-busy', 'true');
        resultMeta.textContent = t('blog.status.sync');
        const loading = document.createElement('p');
        loading.className = 'list-status';
        loading.textContent = t('blog.status.loading');
        list.appendChild(loading);
        return;
      }
      if(state.loadState === 'failed'){
        list.replaceChildren();
        list.setAttribute('aria-busy', 'false');
        resultMeta.textContent = t('blog.status.failed');
        const failure = document.createElement('p');
        failure.className = 'list-status';
        failure.textContent = t('blog.status.failureMessage');
        list.appendChild(failure);
        return;
      }
      const items = getFilteredItems();
      list.replaceChildren();
      list.setAttribute('aria-busy', 'false');

      resultMeta.classList.toggle('likes-ready', state.likesStatus === 'ready');
      const likesNote = state.likesStatus === 'loading'
        ? t('blog.results.loadingLikes')
        : state.likesStatus === 'unavailable'
          ? t('blog.results.likesUnavailable')
          : '';
      resultMeta.textContent = t(items.length === 1 ? 'blog.results.one' : 'blog.results.many', {count: items.length})
        + (likesNote ? ` / ${likesNote}` : '');

      if(items.length === 0){
        const empty = document.createElement('p');
        empty.className = 'list-status';
        empty.textContent = t(state.query ? 'blog.empty.search' : 'blog.empty.category');
        list.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      items.forEach((item,index) => fragment.appendChild(createPostElement(item,index)));
      list.appendChild(fragment);
    }

    async function loadLikes(){
      await Promise.all(state.items.map(async item => {
        const filePath = normalizeFilePath(item.file);
        const likes = await getLikeCount(filePath);
        if(typeof likes === 'number') state.likes.set(filePath, likes);
      }));
      state.likesReady = state.likes.size > 0;
      state.likesStatus = state.likesReady ? 'ready' : 'unavailable';
      renderList();
    }

    async function loadIndex(){
      const list = document.getElementById('list');
      const candidates = ['posts/index.json','/posts/index.json',`${location.origin}/posts/index.json`];
      let index = null;

      for(const url of candidates){
        try{
          index = await tryFetch(url);
          break;
        }catch(error){
          console.warn('Index candidate failed:', url, error);
        }
      }

      if(!Array.isArray(index)){
        state.loadState = 'failed';
        renderList();
        return;
      }

      state.items = index;
      await loadCoverManifest();
      state.loadState = 'ready';
      renderList();
      loadLikes();
    }

    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const categorySelect = document.getElementById('categorySelect');
    const filterButtons = Array.from(document.querySelectorAll('.filter-button'));

    searchInput.addEventListener('input', () => {
      state.query = searchInput.value;
      clearSearch.hidden = state.query.length === 0;
      renderList();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      state.query = '';
      clearSearch.hidden = true;
      searchInput.focus();
      renderList();
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        state.activeCategory = button.dataset.category || 'all';
        categorySelect.value = state.activeCategory;
        filterButtons.forEach(item => {
          const active = item === button;
          item.classList.toggle('is-active', active);
          item.setAttribute('aria-pressed', String(active));
        });
        renderList();
      });
    });

    document.querySelector('.query-panel').addEventListener('submit', event => event.preventDefault());
    window.addEventListener('site-language-change', renderList);
    loadIndex();
  </script>

  <script>
    window.addEventListener('load', () => {
      document.body.classList.add('reveal');
      document.body.classList.remove('preload');
    });
  </script>
</body>
