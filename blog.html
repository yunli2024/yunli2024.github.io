  <script>
    const LIKE_API = 'https://homepagelike.12410922.workers.dev/like';
    const initialParams = new URLSearchParams(location.search);
    const state = {
      items: [],
      activeCategory: (() => {
        const requested = initialParams.get('category');
        return ['course','academic','reflection','daily-life'].includes(requested) ? requested : 'all';
      })(),
      query: initialParams.get('q') || '',
      sort: initialParams.get('sort') === 'popular' ? 'popular' : 'latest',
      likes: new Map(),
      availableCovers: new Set(),
      likesReady: false,
      likesLoaded: false,
      loadState: 'loading'
    };

    // The URL carries the view; history/session storage keeps its reading position.
    const viewStorageKey = 'blog-view-position';
    let pendingRestore = readViewPosition();
    let restoringPosition = false;
    history.scrollRestoration = 'manual';

    function readViewPosition(){
      try{
        const saved = history.state?.blogView
          || (location.hash ? JSON.parse(sessionStorage.getItem(viewStorageKey)) : null);
        if(saved?.search === location.search) return saved;
      }catch(error){ /* The URL still restores filters when storage is unavailable. */ }
      if(location.hash.startsWith('#post-')){
        try{return {anchorId:decodeURIComponent(location.hash.slice(1))};}catch(error){}
      }
      return null;
    }

    function syncViewUrl(){
      pendingRestore = null;
      const url = new URL(location.href);
      for(const [key,value] of [
        ['category',state.activeCategory === 'all' ? '' : state.activeCategory],
        ['q',state.query],
        ['sort',state.sort === 'popular' ? 'popular' : '']
      ]){
        if(value) url.searchParams.set(key,value);
        else url.searchParams.delete(key);
      }
      url.hash = '';
      history.replaceState({...history.state,blogView:null},'',url);
    }

    function saveViewPosition(anchor){
      if(state.loadState !== 'ready' || pendingRestore) return;
      const headerBottom = document.querySelector('header').getBoundingClientRect().bottom;
      const visible = anchor || Array.from(document.querySelectorAll('#list .post'))
        .find(article => article.getBoundingClientRect().bottom > headerBottom);
      const position = {
        search:location.search,
        scrollY:window.scrollY,
        anchorId:visible?.id,
        anchorTop:visible?.getBoundingClientRect().top
      };
      history.replaceState({...history.state,blogView:position},'');
      try{sessionStorage.setItem(viewStorageKey,JSON.stringify(position));}catch(error){}
    }

    async function restoreViewPosition(){
      if(!pendingRestore || restoringPosition) return;
      restoringPosition = true;
      const position = pendingRestore;
      await Promise.race([document.fonts.ready,new Promise(resolve => setTimeout(resolve,1200))]);
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      restoringPosition = false;
      if(pendingRestore !== position) return;
      pendingRestore = null;
      const anchor = position.anchorId && document.getElementById(position.anchorId);
      const offset = position.anchorTop ?? document.querySelector('header').getBoundingClientRect().bottom + 16;
      const top = anchor ? window.scrollY + anchor.getBoundingClientRect().top - offset : position.scrollY || 0;
      window.scrollTo({top:Math.max(0,top),behavior:'instant'});
    }

    const t = (key, replacements = {}) => {
      if(window.SiteUI?.t) return window.SiteUI.t(key, replacements);
      const language = document.documentElement.dataset.language === 'zh' ? 'zh' : 'en';
      let value = window.PAGE_I18N?.[language]?.[key] ?? window.PAGE_I18N?.en?.[key] ?? key;
      Object.entries(replacements).forEach(([name,replacement]) => {
        value = value.replaceAll(`{${name}}`, String(replacement));
      });
      return value;
    };

    function categoryLabel(category){
      const known = ['all','course','academic','reflection','daily-life','uncategorized'];
      return t(`blog.category.${known.includes(category) ? category : 'uncategorized'}`);
    }

    async function tryFetch(url){
      const response = await fetch(url);
      if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
      return response.json();
    }

    async function fetchWithTimeout(url, options = {}, timeout = 8000){
      const controller = new AbortController();
      const timer = window.setTimeout(() => controller.abort(), timeout);
      try{
        return await fetch(url, {...options, signal:controller.signal});
      }finally{
        window.clearTimeout(timer);
      }
    }

    function normalizeTags(tags){
      if(!tags) return [];
      if(Array.isArray(tags)) return tags.map(tag => String(tag).toLowerCase());
      return String(tags).split(/[,\s]+/).map(tag => tag.toLowerCase()).filter(Boolean);
    }

    function displayTags(tags){
      if(!tags) return [];
      if(Array.isArray(tags)) return tags.map(tag => String(tag).trim()).filter(Boolean);
      return String(tags).split(',').map(tag => tag.trim()).filter(Boolean);
    }

    function getCategory(item){
      if(item.category) return String(item.category).toLowerCase();
      const known = ['course','academic','reflection','daily-life'];
      return normalizeTags(item.tags).find(tag => known.includes(tag)) || 'uncategorized';
    }

    function matchesQuery(item, query){
      const words = String(query || '').toLowerCase().trim().split(/[\s,]+/).filter(Boolean);
      if(words.length === 0) return true;
      const haystack = `${item.title || ''} ${item.excerpt || ''} ${normalizeTags(item.tags).join(' ')}`.toLowerCase();
      return words.every(word => haystack.includes(word));
    }

    function normalizeFilePath(file){
      const value = String(file || '');
      return value.startsWith('/') ? value.slice(1) : value;
    }

    function coverFileFor(item){
      const baseName = normalizeFilePath(item.file).split('/').pop() || 'post.md';
      return baseName.replace(/\.md$/i, '_cover.png');
    }

    async function loadCoverManifest(){
      try{
        const manifest = await tryFetch('source/blog-covers.json');
        const covers = Array.isArray(manifest) ? manifest : manifest.covers;
        state.availableCovers = new Set(Array.isArray(covers) ? covers.map(String) : []);
      }catch(error){
        state.availableCovers = new Set();
      }
    }

    async function getLikeCount(file){
      try{
        const response = await fetchWithTimeout(`${LIKE_API}?id=${encodeURIComponent(file)}`);
        if(!response.ok) return null;
        const data = await response.json();
        const likes = Number(data.likes);
        return Number.isFinite(likes) ? likes : null;
      }catch(error){
        return null;
      }
    }

    function appendMeta(container, text){
      const item = document.createElement('span');
      item.textContent = text;
      container.appendChild(item);
    }

    function createPostElement(item, index){
      const filePath = normalizeFilePath(item.file);
      const category = getCategory(item);
      const likes = state.likes.get(filePath);
      const coverFile = coverFileFor(item);
      const coverAvailable = state.availableCovers.has(coverFile);
      const article = document.createElement('article');
      article.className = `post${coverAvailable ? ' has-cover' : ''}`;
      article.dataset.file = filePath;
      article.id = `post-${encodeURIComponent(filePath)}`;

      const number = document.createElement('span');
      number.className = 'post-index';
      number.textContent = String(index + 1).padStart(2, '0');
      article.appendChild(number);

      const content = document.createElement('div');
      content.className = 'post-content';

      const heading = document.createElement('h2');
      const link = document.createElement('a');
      const returnTo = `blog.html${location.search}#${encodeURIComponent(article.id)}`;
      link.href = `post.html?${new URLSearchParams({file:filePath,returnTo})}`;
      link.addEventListener('click',() => saveViewPosition(article));
      link.addEventListener('auxclick',() => saveViewPosition(article));
      link.textContent = item.title || t('blog.untitled');
      heading.appendChild(link);
      content.appendChild(heading);

      const meta = document.createElement('div');
      meta.className = 'post-meta';
      appendMeta(meta, item.date || t('blog.dateFallback'));
      appendMeta(meta, t('blog.meta.category', {category: categoryLabel(category)}));
      const likeCount = document.createElement('span');
      likeCount.className = 'post-likes';
      likeCount.hidden = typeof likes !== 'number';
      likeCount.textContent = typeof likes === 'number' ? t('blog.meta.likes', {likes}) : '';
      meta.appendChild(likeCount);
      content.appendChild(meta);

      if(item.excerpt){
        const excerpt = document.createElement('p');
        excerpt.className = 'post-excerpt';
        excerpt.textContent = item.excerpt;
        content.appendChild(excerpt);
      }

      const tags = displayTags(item.tags);
      if(tags.length){
        const tagList = document.createElement('div');
        tagList.className = 'post-tags';
        tagList.setAttribute('aria-label', t('blog.tags.label'));
        tags.forEach(tag => {
          const tagItem = document.createElement('span');
          tagItem.className = 'post-tag';
          tagItem.textContent = tag;
          tagList.appendChild(tagItem);
        });
        content.appendChild(tagList);
      }
      article.appendChild(content);

      if(coverAvailable){
        const cover = document.createElement('div');
        cover.className = 'post-cover';
        const image = document.createElement('img');
        image.src = `source/${encodeURIComponent(coverFile)}`;
        image.alt = '';
        image.loading = index > 1 ? 'lazy' : 'eager';
        image.decoding = 'async';
        image.addEventListener('error', () => {
          cover.hidden = true;
          article.classList.remove('has-cover');
        });
        cover.appendChild(image);
        article.appendChild(cover);
      }

      return article;
    }

    function getFilteredItems(){
      const filtered = state.items.filter(item => {
        const categoryMatches = state.activeCategory === 'all'
          || getCategory(item) === state.activeCategory
          || normalizeTags(item.tags).includes(state.activeCategory);
        return categoryMatches && matchesQuery(item, state.query);
      });

      filtered.sort((a,b) => {
        if(state.sort === 'popular' && state.likesReady){
          const difference = (state.likes.get(normalizeFilePath(b.file)) || 0)
            - (state.likes.get(normalizeFilePath(a.file)) || 0);
          if(difference) return difference;
        }
        return String(b.date || '').localeCompare(String(a.date || ''))
          || String(a.file || '').localeCompare(String(b.file || ''));
      });
      return filtered;
    }

    function renderList(){
      const list = document.getElementById('list');
      const resultMeta = document.getElementById('resultMeta');
      if(state.loadState === 'loading' || (state.loadState === 'ready' && state.sort === 'popular' && !state.likesLoaded)){
        list.replaceChildren();
        list.setAttribute('aria-busy', 'true');
        resultMeta.textContent = t('blog.status.sync');
        const loading = document.createElement('p');
        loading.className = 'list-status';
        loading.textContent = t(state.loadState === 'loading' ? 'blog.status.loading' : 'blog.sort.loading');
        list.appendChild(loading);
        return;
      }
      if(state.loadState === 'failed'){
        list.replaceChildren();
        list.setAttribute('aria-busy', 'false');
        resultMeta.textContent = t('blog.status.failed');
        const failure = document.createElement('p');
        failure.className = 'list-status';
        failure.textContent = t('blog.status.failureMessage');
        list.appendChild(failure);
        return;
      }
      const items = getFilteredItems();
      list.replaceChildren();
      list.setAttribute('aria-busy', 'false');

      resultMeta.textContent = t(items.length === 1 ? 'blog.results.one' : 'blog.results.many', {count: items.length});

      if(items.length === 0){
        const empty = document.createElement('p');
        empty.className = 'list-status';
        empty.textContent = t(state.query ? 'blog.empty.search' : 'blog.empty.category');
        list.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      items.forEach((item,index) => fragment.appendChild(createPostElement(item,index)));
      list.appendChild(fragment);
      restoreViewPosition();
    }

    function renderSidebarTags(){
      const container = document.getElementById('sidebarTags');
      if(!container) return;
      const tags = new Map();
      state.items.forEach(item => {
        displayTags(item.tags).forEach(tag => {
          const key = tag.toLowerCase();
          const current = tags.get(key) || {label:tag,count:0};
          current.count += 1;
          tags.set(key,current);
        });
      });
      const popular = Array.from(tags.values()).sort((a,b) => b.count - a.count || a.label.localeCompare(b.label)).slice(0,12);
      if(!popular.length){
        const empty = document.createElement('p');
        empty.dataset.i18n = 'blog.sidebar.tagsEmpty';
        empty.textContent = t('blog.sidebar.tagsEmpty');
        container.replaceChildren(empty);
        return;
      }
      const fragment = document.createDocumentFragment();
      popular.forEach(tag => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'sidebar-tag';
        const label = document.createElement('span');
        label.textContent = tag.label;
        const count = document.createElement('small');
        count.textContent = tag.count;
        button.append(label,count);
        button.addEventListener('click',() => {
          searchInput.value = tag.label;
          state.query = tag.label;
          clearSearch.hidden = false;
          setActiveCategory('all');
          document.getElementById('list')?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
        });
        fragment.appendChild(button);
      });
      container.replaceChildren(fragment);
    }

    async function loadLikes(){
      await Promise.all(state.items.map(async item => {
        const filePath = normalizeFilePath(item.file);
        const likes = await getLikeCount(filePath);
        if(typeof likes === 'number') state.likes.set(filePath, likes);
      }));
      state.likesReady = state.likes.size > 0;
      state.likesLoaded = true;
      const popularButton = document.querySelector('[data-sort="popular"]');
      popularButton.disabled = !state.likesReady;
      if(state.likesReady){
        popularButton.removeAttribute('title');
        popularButton.removeAttribute('data-i18n-title');
      }else{
        popularButton.dataset.i18nTitle = 'blog.sort.unavailable';
        popularButton.title = t('blog.sort.unavailable');
      }
      if(state.sort === 'popular'){
        if(!state.likesReady){
          state.sort = 'latest';
          // Preserve the saved position while gracefully falling back to date order.
          const url = new URL(location.href);
          url.searchParams.delete('sort');
          history.replaceState(history.state,'',url);
          updateSortControls();
        }
        renderList();
        return;
      }
      // Update counts in place so late responses preserve order, focus, and scroll.
      document.querySelectorAll('#list .post').forEach(article => {
        const likes = state.likes.get(article.dataset.file);
        const count = article.querySelector('.post-likes');
        count.hidden = typeof likes !== 'number';
        count.textContent = typeof likes === 'number' ? t('blog.meta.likes', {likes}) : '';
      });
    }

    async function loadIndex(){
      const list = document.getElementById('list');
      const candidates = ['posts/index.json','/posts/index.json',`${location.origin}/posts/index.json`];
      let index = null;

      for(const url of candidates){
        try{
          index = await tryFetch(url);
          break;
        }catch(error){
          console.warn('Index candidate failed:', url, error);
        }
      }

      if(!Array.isArray(index)){
        state.loadState = 'failed';
        renderList();
        return;
      }

      state.items = index;
      await loadCoverManifest();
      state.loadState = 'ready';
      renderSidebarTags();
      renderList();
      loadLikes();
    }

    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');
    const categorySelect = document.getElementById('categorySelect');
    const filterButtons = Array.from(document.querySelectorAll('.filter-button'));
    const sortButtons = Array.from(document.querySelectorAll('.sort-button'));

    function updateSortControls(){
      sortButtons.forEach(control => {
        const active = control.dataset.sort === state.sort;
        control.classList.toggle('is-active',active);
        control.setAttribute('aria-pressed',String(active));
      });
    }

    function setActiveCategory(category,{updateUrl = true} = {}){
      state.activeCategory = ['course','academic','reflection','daily-life'].includes(category) ? category : 'all';
      categorySelect.value = state.activeCategory;
      filterButtons.forEach(button => {
        const active = button.dataset.category === state.activeCategory;
        button.classList.toggle('is-active',active);
        button.setAttribute('aria-pressed',String(active));
      });
      document.querySelectorAll('[data-blog-category]').forEach(link => {
        if(link.dataset.blogCategory === state.activeCategory) link.setAttribute('aria-current','page');
        else link.removeAttribute('aria-current');
      });
      if(updateUrl) syncViewUrl();
      renderList();
    }

    searchInput.addEventListener('input', () => {
      state.query = searchInput.value;
      clearSearch.hidden = state.query.length === 0;
      syncViewUrl();
      renderList();
    });

    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      state.query = '';
      clearSearch.hidden = true;
      searchInput.focus();
      syncViewUrl();
      renderList();
    });

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        setActiveCategory(button.dataset.category || 'all');
      });
    });

    sortButtons.forEach(button => {
      button.addEventListener('click', () => {
        if(button.dataset.sort === state.sort) return;
        state.sort = button.dataset.sort;
        updateSortControls();
        syncViewUrl();
        renderList();
      });
    });

    document.querySelector('.query-panel').addEventListener('submit', event => event.preventDefault());
    window.addEventListener('site-language-change', renderList);
    window.addEventListener('pagehide',() => saveViewPosition());
    searchInput.value = state.query;
    clearSearch.hidden = !state.query;
    updateSortControls();
    setActiveCategory(state.activeCategory,{updateUrl:false});
    loadIndex();
  </script>

  <script>
    window.addEventListener('load', () => {
      document.body.classList.add('reveal');
      document.body.classList.remove('preload');
    });
  </script>
</body>
</html>
