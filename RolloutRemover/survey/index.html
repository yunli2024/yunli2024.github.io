<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>RolloutRemover User Study Interface</title>
  <link rel="stylesheet" href="paper.css">
</head>
<body>
  <main class="paper" aria-label="RolloutRemover user study interface figures">
    <figure class="paper-figure">
      <section class="stimuli-panel" aria-labelledby="task-heading">
        <header class="task-header">
          <h1 id="task-heading">Task 1</h1>
          <span>1 / 1</span>
        </header>

        <p class="instruction">
          Remove the marked object, reconstruct the region naturally, and preserve the remaining scene.
        </p>

        <div class="stimuli-layout">
          <section class="input-group" aria-labelledby="input-label">
            <h2 id="input-label">Input</h2>
            <div class="image-frame input-frame">
              <img src="../../survey/assets/sraw-v5/f2/t10/input.png"
                   alt="Input scene with the target object marked for removal">
            </div>
          </section>

          <section class="candidate-group" aria-labelledby="candidate-label">
            <h2 id="candidate-label">Candidate results</h2>
            <div class="candidate-grid">
              <article class="candidate">
                <div class="image-frame">
                  <img src="../../survey/assets/sraw-v5/f2/t10/c02.png" alt="Candidate result A">
                </div>
                <div class="candidate-label">A</div>
              </article>
              <article class="candidate">
                <div class="image-frame">
                  <img src="../../survey/assets/sraw-v5/f2/t10/c05.png" alt="Candidate result B">
                </div>
                <div class="candidate-label">B</div>
              </article>
              <article class="candidate">
                <div class="image-frame">
                  <img src="../../survey/assets/sraw-v5/f2/t10/c04.png" alt="Candidate result C">
                </div>
                <div class="candidate-label">C</div>
              </article>
              <article class="candidate">
                <div class="image-frame">
                  <img src="../../survey/assets/sraw-v5/f2/t10/c06.png" alt="Candidate result D">
                </div>
                <div class="candidate-label">D</div>
              </article>
              <article class="candidate">
                <div class="image-frame">
                  <img src="../../survey/assets/sraw-v5/f2/t10/c03.png" alt="Candidate result E">
                </div>
                <div class="candidate-label">E</div>
              </article>
              <article class="candidate">
                <div class="image-frame">
                  <img src="../../survey/assets/sraw-v5/f2/t10/c01.png" alt="Candidate result F">
                </div>
                <div class="candidate-label">F</div>
              </article>
            </div>
          </section>
        </div>
      </section>
      <figcaption>
        <span class="caption-label">Figure 13:</span> Task presentation and candidate outputs in the user study interface.
      </figcaption>
    </figure>

    <figure class="paper-figure">
      <section class="criteria-panel" aria-labelledby="criteria-heading">
        <h1 id="criteria-heading">Evaluation criteria</h1>

        <ol class="criteria-list">
          <li class="criterion">
            <div class="criterion-copy">
              <h2>Removal Completeness</h2>
              <p>Which two results most completely remove the marked object and its associated effects, with the fewest visible remnants?</p>
            </div>
            <div class="option-row" aria-label="Static selection controls for Removal Completeness">
              <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span>
            </div>
          </li>
          <li class="criterion">
            <div class="criterion-copy">
              <h2>Background Plausibility</h2>
              <p>Which two results reconstruct the removed region with the most realistic and context-consistent background?</p>
            </div>
            <div class="option-row" aria-label="Static selection controls for Background Plausibility">
              <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span>
            </div>
          </li>
          <li class="criterion">
            <div class="criterion-copy">
              <h2>Edge Seamlessness</h2>
              <p>Which two results blend the removed region most seamlessly with its surroundings, with the fewest boundary artifacts?</p>
            </div>
            <div class="option-row" aria-label="Static selection controls for Edge Seamlessness">
              <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span>
            </div>
          </li>
          <li class="criterion">
            <div class="criterion-copy">
              <h2>Non-Target Preservation</h2>
              <p>Which two results best preserve non-target objects and scene details, with the fewest unintended changes?</p>
            </div>
            <div class="option-row" aria-label="Static selection controls for Non-Target Preservation">
              <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span>
            </div>
          </li>
          <li class="criterion">
            <div class="criterion-copy">
              <h2>Overall Performance</h2>
              <p>Which two results provide the best overall object-removal outputs?</p>
            </div>
            <div class="option-row" aria-label="Static selection controls for Overall Performance">
              <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span>
            </div>
          </li>
        </ol>
      </section>
      <figcaption>
        <span class="caption-label">Figure 14:</span> Evaluation criteria and Top-2 selection controls in the user study interface.
      </figcaption>
    </figure>
  </main>
</body>
</html>
