  <script>
    let renderedPostTitle = '';
    let contentStatus = {key:'post.loading',replacements:{}};
    let tocHeadings = [];
    let tocLinks = [];

    function currentPageLanguage(){
      if(window.SiteUI?.language) return window.SiteUI.language;
      const declaredLanguage = document.documentElement.dataset.language || document.documentElement.lang;
      return String(declaredLanguage || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en';
    }
    function pageTranslate(key,replacements = {}){
      if(window.SiteUI?.t) return window.SiteUI.t(key,replacements);
      let value = window.PAGE_I18N?.[currentPageLanguage()]?.[key]
        ?? window.PAGE_I18N?.en?.[key]
        ?? key;
      Object.entries(replacements).forEach(([name,replacement]) => {
        value = value.replaceAll(`{${name}}`,String(replacement));
      });
      return value;
    }
    function renderContentStatus(){
      if(!contentStatus) return;
      const content = document.getElementById('content');
      if(!content) return;
      const status = document.createElement('span');
      status.dataset.i18n = contentStatus.key;
      status.textContent = pageTranslate(contentStatus.key,contentStatus.replacements);
      content.replaceChildren(status);
    }
    function showContentStatus(key,replacements = {}){
      contentStatus = {key,replacements};
      renderContentStatus();
      document.getElementById('content')?.setAttribute('aria-busy','false');
    }
    function updatePostDocumentTitle(){
      if(renderedPostTitle){
        document.title = `${renderedPostTitle} — ${pageTranslate('post.titleSuffix')}`;
      }
    }

    function qs(name){const u=new URL(location.href);return u.searchParams.get(name)}
    function normalizePostFile(rawFile){
      if(typeof rawFile !== 'string' || !rawFile) return null;
      try{
        const candidate = new URL(rawFile, `${location.origin}/`);
        if(candidate.origin !== location.origin || candidate.search || candidate.hash) return null;
        const decodedPath = decodeURIComponent(candidate.pathname);
        const normalized = new URL(decodedPath, `${location.origin}/`);
        const validPath = normalized.origin === location.origin
          && normalized.pathname === candidate.pathname
          && decodedPath.startsWith('/posts/')
          && !decodedPath.includes('\\')
          && !decodedPath.split('/').includes('..')
          && decodedPath.toLowerCase().endsWith('.md');
        return validPath ? decodedPath.slice(1) : null;
      }catch(error){
        return null;
      }
    }
    async function getPostMeta(file){
      try{
        const response = await fetch('posts/index.json');
        if(!response.ok) return null;
        const index = await response.json();
        if(!Array.isArray(index)) return null;
        return index.find(item => normalizePostFile(item.file) === file) || null;
      }catch(error){
        return null;
      }
    }
    function normalizeHeadingLevels(container){
      const headings = Array.from(container.querySelectorAll(':scope > h2,:scope > h3,:scope > h4,:scope > h5,:scope > h6'));
      if(headings.length === 0) return;
      const firstLevel = Number(headings[0].tagName.slice(1));
      const shift = Math.max(0, firstLevel - 2);
      let previousLevel = 1;
      headings.forEach(heading => {
        const sourceLevel = Number(heading.tagName.slice(1));
        const targetLevel = Math.max(2, Math.min(sourceLevel - shift, previousLevel + 1, 6));
        if(targetLevel !== sourceLevel){
          const replacement = document.createElement(`h${targetLevel}`);
          Array.from(heading.attributes).forEach(attribute => replacement.setAttribute(attribute.name, attribute.value));
          replacement.append(...heading.childNodes);
          heading.replaceWith(replacement);
        }
        previousLevel = targetLevel;
      });
    }
    function buildPostToc(container){
      const aside = document.getElementById('postToc');
      const nav = document.getElementById('postTocLinks');
      if(!aside || !nav) return;
      tocHeadings = Array.from(container.querySelectorAll(':scope > h2,:scope > h3'));
      tocLinks = [];
      if(!tocHeadings.length){
        aside.hidden = true;
        nav.replaceChildren();
        return;
      }
      const usedIds = new Set();
      const fragment = document.createDocumentFragment();
      tocHeadings.forEach((heading,index) => {
        let slug = heading.textContent.trim().normalize('NFKC').toLowerCase()
          .replace(/[^\p{L}\p{N}]+/gu,'-')
          .replace(/^-+|-+$/g,'') || `section-${index + 1}`;
        let id = slug;
        let suffix = 2;
        while(usedIds.has(id) || document.getElementById(id)) id = `${slug}-${suffix++}`;
        usedIds.add(id);
        heading.id = id;
        const link = document.createElement('a');
        link.href = `#${encodeURIComponent(id)}`;
        link.className = `toc-link toc-${heading.tagName.toLowerCase()}`;
        link.textContent = heading.textContent.trim();
        link.addEventListener('click',event => {
          event.preventDefault();
          heading.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth',block:'start'});
          history.replaceState({},'',`#${encodeURIComponent(id)}`);
        });
        tocLinks.push(link);
        fragment.appendChild(link);
      });
      nav.replaceChildren(fragment);
      aside.hidden = false;
    }
    function escapeHtml(value){
      return value.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));
    }
    function protectMath(markdown){
      const values = [];
      const stash = value => {
        const key = `@@MATH_${values.length}@@`;
        values.push(value);
        return key;
      };
      const protectText = text => text
        .replace(/\$\$([\s\S]+?)\$\$/g, (_, body) => stash(`$$${body}$$`))
        .replace(/\\\[([\s\S]+?)\\\]/g, (_, body) => stash(`\\[${body}\\]`))
        .replace(/\\\(([\s\S]+?)\\\)/g, (_, body) => stash(`\\(${body}\\)`))
        .replace(/(^|[^\\$])\$([^\n$]+?)\$/g, (_, prefix, body) => `${prefix}${stash(`$${body}$`)}`);
      const protectedMarkdown = markdown
        .split(/(```[\s\S]*?```|`[^`\n]*`)/g)
        .map(part => part.startsWith('`') ? part : protectText(part))
        .join('');
      return {
        markdown: protectedMarkdown,
        restore(html){
          return values.reduce((output, value, index) => (
            output.replaceAll(`@@MATH_${index}@@`, escapeHtml(value))
          ), html);
        }
      };
    }
    async function typesetMath(el){
      if(!window.MathJax || !el) return;
      try{
        if(MathJax.startup && MathJax.startup.promise) await MathJax.startup.promise;
        if(MathJax.typesetClear) MathJax.typesetClear([el]);
        if(MathJax.typesetPromise) await MathJax.typesetPromise([el]);
      }catch(e){
        console.warn('MathJax render failed', e);
      }
    }
    async function load(){
      const content = document.getElementById('content');
      const rawFile = qs('file');
      if(!rawFile){showContentStatus('post.error.noFile');return}
      const file = normalizePostFile(rawFile);
      if(!file){showContentStatus('post.error.invalidPath');console.error('Invalid post path:', rawFile);return}
      const metaPromise = getPostMeta(file);

      try{
        // try multiple relative forms to avoid absolute-path issues
        const candidates = Array.from(new Set(
          [file, './' + file, '/' + file, location.origin + '/' + file]
            .map(candidate => new URL(candidate, location.href).href)
        ));
        let res = null;
        for(const u of candidates){
          try{ res = await fetch(u); if(res && res.ok) break }catch(err){ console.warn('fetch candidate failed', u, err) }
        }
        if(!res || !res.ok){
          const status = res ? `HTTP ${res.status}` : pageTranslate('post.status.network');
          showContentStatus('post.error.read',{status});
          console.error('All fetch candidates failed for', file, res);
          return;
        }
        const md = await res.text();
        const meta = await metaPromise;
        const fallbackTitle = file.split('/').pop().replace(/\.md$/i,'');
        const postTitle = String(meta?.title || fallbackTitle || pageTranslate('post.fallbackTitle'));
        renderedPostTitle = postTitle;
        if(!window.marked || typeof window.marked.parse !== 'function'){
          const heading = document.createElement('h1');
          heading.textContent = postTitle;
          const notice = document.createElement('p');
          notice.className = 'renderer-notice';
          notice.dataset.i18n = 'post.rendererNotice';
          notice.textContent = pageTranslate('post.rendererNotice');
          const source = document.createElement('pre');
          source.className = 'markdown-source';
          source.textContent = md;
          contentStatus = null;
          content.replaceChildren(heading, notice, source);
          buildPostToc(content);
          updatePostDocumentTitle();
          content.setAttribute('aria-busy','false');
          return;
        }
        const math = protectMath(md);
        contentStatus = null;
        content.innerHTML = math.restore(marked.parse(math.markdown));
        let title = content.querySelector(':scope > h1');
        if(!title){
          const firstHeading = content.querySelector(':scope > h2,:scope > h3,:scope > h4');
          if(firstHeading && firstHeading.textContent.trim() === postTitle) firstHeading.remove();
          title = document.createElement('h1');
          title.textContent = postTitle;
          content.prepend(title);
        }
        normalizeHeadingLevels(content);
        buildPostToc(content);
        renderedPostTitle = title.textContent.trim() || postTitle;
        updatePostDocumentTitle();
        await typesetMath(content);
        content.setAttribute('aria-busy','false');
      }catch(e){
        showContentStatus('post.error.generic');
        console.error('Fetch error for', file, e);
      }
    }
    window.addEventListener('site-language-change',()=>{
      renderContentStatus();
      updatePostDocumentTitle();
    });
    load();
  </script>
  <script>
    const LIKE_API = 'https://homepagelike.12410922.workers.dev/like';
    async function fetchLikeApi(url, options = {}, timeout = 8000){
      const controller = new AbortController();
      const timer = window.setTimeout(() => controller.abort(), timeout);
      try{
        return await fetch(url, {...options, signal:controller.signal});
      }finally{
        window.clearTimeout(timer);
      }
    }
    const likeState = {
      count:0,
      unavailable:false,
      loaded:false,
      messageKey:'',
      sending:false,
      version:0
    };
    function renderLikeUi(){
      const button = document.getElementById('likeBtn');
      const count = document.getElementById('likeCount');
      const message = document.getElementById('likeMsg');
      if(button){
        const buttonKey = likeState.sending ? 'like.sending' : 'like.button';
        button.dataset.i18n = buttonKey;
        button.textContent = pageTranslate(buttonKey);
        button.disabled = likeState.sending;
      }
      if(count){
        count.textContent = !likeState.loaded
          ? pageTranslate('like.loading')
          : likeState.unavailable
          ? pageTranslate('like.unavailable')
          : pageTranslate('like.count',{count:likeState.count});
      }
      if(message){
        message.textContent = likeState.messageKey ? pageTranslate(likeState.messageKey) : '';
      }
    }
    async function refreshLikes(file){
      if(!file) return;
      const requestVersion = likeState.version;
      try{
        const res = await fetchLikeApi(`${LIKE_API}?id=${encodeURIComponent(file)}`);
        if(!res.ok) throw new Error(`${res.status}`);
        const data = await res.json();
        if(requestVersion !== likeState.version) return;
        likeState.count = Number(data.likes) || 0;
        likeState.loaded = true;
        likeState.unavailable = false;
      }catch(error){
        if(requestVersion !== likeState.version) return;
        likeState.loaded = true;
        likeState.unavailable = true;
      }
      renderLikeUi();
    }
    async function sendLike(file){
      if(!file) return;
      likeState.version += 1;
      likeState.sending = true;
      likeState.messageKey = '';
      renderLikeUi();
      try{
        const res = await fetchLikeApi(`${LIKE_API}?id=${encodeURIComponent(file)}`, {method:'POST'});
        if(!res.ok) throw new Error(`${res.status}`);
        const data = await res.json();
        likeState.count = Number(data.likes) || 0;
        likeState.loaded = true;
        likeState.unavailable = false;
        likeState.messageKey = data.throttled ? 'like.throttled' : '';
      }catch(error){
        if(!likeState.loaded){
          likeState.loaded = true;
          likeState.unavailable = true;
        }
        likeState.messageKey = 'like.failed';
        void refreshLikes(file);
      }finally{
        setTimeout(()=>{
          likeState.sending = false;
          renderLikeUi();
        }, 500);
      }
    }
    (function(){
      const file = normalizePostFile(qs('file'));
      const panel = document.getElementById('likePanel');
      if(!file){
        if(panel) panel.hidden = true;
        return;
      }
      const btn = document.getElementById('likeBtn');
      refreshLikes(file);
      if(btn){btn.addEventListener('click', ()=> sendLike(file));}
    })();
    window.addEventListener('site-language-change',renderLikeUi);
    renderLikeUi();
  </script>
  <script>
    const readingProgressBar = document.getElementById('readingProgressBar');
    const readingBuddy = document.getElementById('readingBuddy');
    const readingPercent = document.getElementById('readingPercent');
    const BUDDY_POSITION_KEY = 'reading-buddy-position-v1';
    let progressFrame = 0;
    let buddyResizeFrame = 0;
    let buddyDragFrame = 0;
    let buddyDrag = null;
    let suppressBuddyClickUntil = 0;

    function clampBuddy(value,min,max){
      return Math.min(Math.max(value,min),Math.max(min,max));
    }

    function readBuddyPosition(){
      try{
        const value = JSON.parse(localStorage.getItem(BUDDY_POSITION_KEY) || 'null');
        return value && Number.isFinite(value.x) && Number.isFinite(value.y) ? value : null;
      }catch(error){
        return null;
      }
    }

    function saveBuddyPosition(left,top,width,height){
      const padding = 8;
      const availableX = Math.max(1,window.innerWidth - width - padding * 2);
      const availableY = Math.max(1,window.innerHeight - height - padding * 2);
      const value = {
        x:clampBuddy((left - padding) / availableX,0,1),
        y:clampBuddy((top - padding) / availableY,0,1)
      };
      try{localStorage.setItem(BUDDY_POSITION_KEY,JSON.stringify(value))}catch(error){}
    }

    function setBuddyPosition(left,top,{persist = false} = {}){
      if(!readingBuddy) return;
      const rect = readingBuddy.getBoundingClientRect();
      const width = readingBuddy.offsetWidth || rect.width || 58;
      const height = readingBuddy.offsetHeight || rect.height || 58;
      const padding = 8;
      const nextLeft = clampBuddy(left,padding,window.innerWidth - width - padding);
      const nextTop = clampBuddy(top,padding,window.innerHeight - height - padding);
      readingBuddy.style.left = `${nextLeft}px`;
      readingBuddy.style.top = `${nextTop}px`;
      readingBuddy.style.right = 'auto';
      readingBuddy.style.bottom = 'auto';
      readingBuddy.style.transform = '';
      readingBuddy.classList.toggle('tooltip-right',nextLeft + width / 2 < window.innerWidth / 2);
      if(persist) saveBuddyPosition(nextLeft,nextTop,width,height);
    }

    function placeBuddy(){
      if(!readingBuddy || buddyDrag) return;
      const rect = readingBuddy.getBoundingClientRect();
      const width = readingBuddy.offsetWidth || rect.width || 58;
      const height = readingBuddy.offsetHeight || rect.height || 58;
      const saved = readBuddyPosition();
      if(saved){
        const padding = 8;
        setBuddyPosition(
          padding + saved.x * Math.max(1,window.innerWidth - width - padding * 2),
          padding + saved.y * Math.max(1,window.innerHeight - height - padding * 2)
        );
        return;
      }
      const rightInset = window.innerWidth <= 700
        ? 74
        : clampBuddy(window.innerWidth * .115,144,190);
      const bottomInset = window.innerWidth <= 700 ? 18 : 30;
      setBuddyPosition(window.innerWidth - width - rightInset,window.innerHeight - height - bottomInset);
    }

    function applyBuddyDrag(){
      buddyDragFrame = 0;
      if(!readingBuddy || !buddyDrag) return;
      readingBuddy.style.transform = `translate3d(${buddyDrag.left - buddyDrag.startLeft}px,${buddyDrag.top - buddyDrag.startTop}px,0)`;
    }

    function finishBuddyDrag(event){
      if(!readingBuddy || !buddyDrag || event.pointerId !== buddyDrag.pointerId) return;
      if(buddyDragFrame){
        cancelAnimationFrame(buddyDragFrame);
        buddyDragFrame = 0;
      }
      const {left,top,moved,pointerId} = buddyDrag;
      buddyDrag = null;
      readingBuddy.classList.remove('is-dragging');
      if(readingBuddy.hasPointerCapture(pointerId)) readingBuddy.releasePointerCapture(pointerId);
      setBuddyPosition(left,top,{persist:moved});
      if(moved) suppressBuddyClickUntil = performance.now() + 160;
    }

    readingBuddy?.addEventListener('pointerdown',event => {
      if(buddyDrag || (event.pointerType === 'mouse' && event.button !== 0)) return;
      const rect = readingBuddy.getBoundingClientRect();
      const width = readingBuddy.offsetWidth || rect.width;
      const height = readingBuddy.offsetHeight || rect.height;
      buddyDrag = {
        pointerId:event.pointerId,
        startX:event.clientX,
        startY:event.clientY,
        startLeft:rect.left,
        startTop:rect.top,
        left:rect.left,
        top:rect.top,
        moved:false
      };
      readingBuddy.style.left = `${rect.left}px`;
      readingBuddy.style.top = `${rect.top}px`;
      readingBuddy.style.right = 'auto';
      readingBuddy.style.bottom = 'auto';
      readingBuddy.style.transform = 'translate3d(0,0,0)';
      readingBuddy.classList.add('is-dragging');
      readingBuddy.setPointerCapture(event.pointerId);
      event.preventDefault();
    });

    readingBuddy?.addEventListener('pointermove',event => {
      if(!buddyDrag || event.pointerId !== buddyDrag.pointerId) return;
      const rect = readingBuddy.getBoundingClientRect();
      const width = readingBuddy.offsetWidth || rect.width;
      const height = readingBuddy.offsetHeight || rect.height;
      const padding = 8;
      const deltaX = event.clientX - buddyDrag.startX;
      const deltaY = event.clientY - buddyDrag.startY;
      buddyDrag.left = clampBuddy(buddyDrag.startLeft + deltaX,padding,window.innerWidth - width - padding);
      buddyDrag.top = clampBuddy(buddyDrag.startTop + deltaY,padding,window.innerHeight - height - padding);
      if(Math.hypot(deltaX,deltaY) > 4) buddyDrag.moved = true;
      if(!buddyDragFrame) buddyDragFrame = requestAnimationFrame(applyBuddyDrag);
    });

    readingBuddy?.addEventListener('pointerup',finishBuddyDrag);
    readingBuddy?.addEventListener('pointercancel',finishBuddyDrag);
    function updateReadingProgress(){
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      const progress = scrollable > 0 ? Math.min(window.scrollY / scrollable, 1) : 0;
      readingProgressBar.style.transform = `scaleX(${progress})`;
      const percent = Math.round(progress * 100);
      readingBuddy?.style.setProperty('--reading-progress',`${percent}%`);
      if(readingPercent) readingPercent.textContent = `${percent}%`;
      if(readingBuddy){
        readingBuddy.classList.toggle('is-visible',window.scrollY > 140 || progress > .02);
        readingBuddy.setAttribute('aria-label',pageTranslate('post.progress.label',{progress:percent}));
        readingBuddy.setAttribute('title',pageTranslate('post.progress.action'));
      }
      let activeIndex = 0;
      tocHeadings.forEach((heading,index) => {
        if(heading.getBoundingClientRect().top <= 170) activeIndex = index;
      });
      tocLinks.forEach((link,index) => {
        const active = index === activeIndex;
        link.classList.toggle('is-active',active);
        if(active) link.setAttribute('aria-current','location');
        else link.removeAttribute('aria-current');
      });
      progressFrame = 0;
    }
    function queueReadingProgress(){
      if(!progressFrame) progressFrame = requestAnimationFrame(updateReadingProgress);
    }
    readingBuddy?.addEventListener('click',event => {
      if(performance.now() < suppressBuddyClickUntil){
        event.preventDefault();
        return;
      }
      window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    });
    readingBuddy?.addEventListener('dragstart',event => event.preventDefault());
    updateReadingProgress();
    requestAnimationFrame(placeBuddy);
    window.addEventListener('scroll', queueReadingProgress, {passive:true});
    window.addEventListener('resize',() => {
      queueReadingProgress();
      if(!buddyResizeFrame){
        buddyResizeFrame = requestAnimationFrame(() => {
          buddyResizeFrame = 0;
          placeBuddy();
        });
      }
    });
    window.addEventListener('site-language-change',queueReadingProgress);
  </script>
</body>
